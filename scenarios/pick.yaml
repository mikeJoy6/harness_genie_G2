name: pick
tasks: ["拿起鼠标"]
objects: {mouse: [[0.65, -0.20, 0.72]]}
checks:
  - label: 张开 → 下探到鼠标(gap 0)→ 闭合
    type: in_order
    calls:
      - {tool: gripper, args: {action: open}}
      - {tool: touch_object, args: {object_id: "mouse*", gap_cm: 0}}
      - {tool: gripper, args: {action: close}}
  - {label: 闭合以后用 find_objects 确认, level: should, type: after,
     first: {tool: gripper, args: {action: close}}, then: {tool: find_objects}}
  - {label: 读了 pick_up_object 经验, level: should, type: called, tool: read_experience, args: {name: pick_up_object}}
