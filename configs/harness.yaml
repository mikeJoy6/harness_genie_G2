llm:
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  thinking: disabled        # enabled 更慢,但模型会先推理
  timeout_s: 90

agent:
  max_steps: 20             # 一条指令最多问模型几轮(每轮 = 模型回一次,可能调一个或多个工具)

motion:
  speed_m_s: 0.05           # 末端速度
  # 下面的“末端”都是手臂链末端 = TCP(tcp_*_link,夹爪尖;hardware.launch end_effector:=true 的 URDF 才有,
  #   没有时退回法兰 arm_*_end_link,那时这些高度要加 0.128m)。2026-11-13 从法兰改到 TCP。
  standoff_default_m: 0.12  # approach_object:夹爪尖停在物体上方多高(原法兰 0.25 = 夹爪尖 0.122)
  standoff_min_m: 0.03
  standoff_max_m: 0.30
  max_travel_m: 1.70        # 一次最多移动多远
  detection_max_age_s: 120  # find_objects 的结果多久后作废。没有底盘,base_link 不动,机器人自己动不会让坐标失效;
                            # 只防“物体被人挪了”。30s 时“拿起来”整串走到 touch_object 已经过期(2026-11-13 改)
  look_at_match_m: 0.15     # look_at_object 转头后再分割,离原位置这么近才算同一个物体
  min_path_above_object_m: 0.02  # approach_object 整条路径上夹爪尖都要比物体高这么多,防止扫过桌面
  max_moves_per_command: 8  # 一条指令最多动几次(夹爪开合也算)。“低头找鼠标,拿起来”= 转头+上方+张开+下探+闭合+上抬 = 6
  confirm_motion: false     # true = 真机每次运动(含夹爪)前打印计划并等人按 y;false = 打印计划后直接执行
                            # 临时打开:run_task.py / goto_pose.py / gripper_cli.py / motion_cli.py 加 --confirm
  workspace:                # 末端目标点必须在此范围内(base_link,米);右臂是左臂的 y 镜像
    left:
      x: [0.20, 1.85]
      y: [-0.20, 1.75]
      z: [0.30, 2.30]
    right:
      x: [0.20, 1.85]
      y: [-0.75, 1.20]
      z: [0.30, 2.30]

  # move_arm_end:手臂末端相对移动(先直线,不行再 via_then_rrt 绕障,和 pose_ab_search 同一套)
  # 碰撞由规划器负责(整机自碰撞 + octomap + planning scene 碰撞体),这里只挡明显输错的数
  max_offset_m: 0.60        # 一次相对移动最多多远
  max_rotate_deg: 90        # 一次最多转多少度
  max_path_dip_m: null      # 路径最低点最多比起点、终点中较低者再低多少;null = 不检查。
                            # 桌面没进 octomap(相机没看到)时规划器不知道它在,这时可以设 0.05 兜底

  # 手臂终点姿态(模型没指定转角时)按顺序试,第一个规划成功的就用(harness/motion/goal_pose.py):
  #   keep 保持当前姿态;comfort 三角函数算的舒适姿态;free 只管位置、姿态随它变
  goal_orientation:
    approach_object: [comfort, keep, free]   # 去物体上方:先求舒服
    move_arm_end: [keep, free]               # “上抬 10 厘米”:先保持手腕姿态,够不着再放松

  arm_reach_m: 0.80         # 肩心到夹爪尖伸直最远 L1+L2+0.09+0.128 ≈ 0.83m;find_objects 用它报 reachable_by
  touch:                    # touch_object:唯一会碰到物体、最后一段只放过物体附近点云的运动(RosBackend.plan_touch)
    default_gap_cm: 2       # 夹爪尖停在物体表面前多少厘米(物体坐标是可见表面的中位点)
    max_gap_cm: 10
    backoffs_cm: [5, 8, 12, 16, 20, 25, 30]   # 预接触点离接触点多远,从近到远试;最后一个 = 最后一段的最长距离
                            # 不从 3cm 起:点云 3cm 一格,物体周围外扩后 3cm 处基本都“撞”
    roll_offsets_deg: [0, 45, -45, 90, -90]   # 同一个预接触点,手腕绕工具轴依次多转这些角度再试(先不自转)
    max_plan_tries: 4       # 验过的预接触点最多真规划几个(每个最坏 ~10s:直线 + 绕障 8s + 关节 RRT)
    final_speed_m_s: 0.03   # 最后一段(只放过物体附近的点云)的末端速度
    joint_speed_rad_s: 0.20 # 第一段末端规划不通、改走关节空间时的速度
    max_joint_fallback_deg: 90   # 第一段改走关节空间时,任一关节最多转多少度;超了宁可失败(11-14 真机甩了 154°)
    keep_out:               # 最后一段 MoveIt 不查点云,改成自己用几何查(harness/touch_keep_out.py,2026-11-14 撞桌面后加)
      object_radius_m: 0.08 # 物体坐标(可见表面中位点)这么近的点云格可以碰:物体自己,和它正下方的一点台面
      gripper_radius_m: 0.04  # 夹爪近似成胶囊:半径
      gripper_length_m: 0.13  # 从夹爪尖往回多长(TCP 到法兰 0.128m)
    force:                  # 最后一段边走边看末端六维力(harness/backends/wrench_gdk.py,2026-11-14 加)
      enabled: true         # 收不到力时自动退回“只走到接触点”
      frames: {left: arm_l_end_link, right: arm_r_end_link}   # /gdk/motion_control_status 里的名字
      threshold_n: 5.0      # 力比零点变了这么多(N,模长)= 碰到东西,马上停。真机没调过:
                            #   ros2 run genie_robot_agibot_g2_hardware arm_monitor.py --arm right 看慢速移动时的读数再定
      tare_s: 0.3           # 到预接触点后静止取零点的时长(夹爪重量也被减掉)
      max_age_s: 0.1        # 力这么久没更新就当断了,立刻停
      overshoot_m: 0.05     # gap 为 0 时终点再往前多走多少:碰到桌面 / 物体以力为准,多走的这段不会真走完
      retreat_m: 0.02       # 碰到后沿接近方向往回退多少(给闭合夹爪留空间)
      settle_s: 0.3         # 停下后等多久再退
  body_assist:              # 手臂够不着时先动腰:按改动从小到大找前倾(body j3,正 = 往前)/ 转腰(j5)
    enabled: true
    max_lean_deg: 30
    max_turn_deg: 20
    speed_rad_s: 0.10
  point_min_distance_m: 0.15   # point_at_object:末端离物体至少这么远才指(防止戳到人)
  tool_axis_tolerance_deg: 15   # tool_axis(夹爪朝下等)严格做不到时,同一位置差这么多度以内也接受,并报实际差几度
  tool_axis_retreat:        # move_arm_end 给了 tool_axis(“夹爪朝下”)但原地转不到:往身体方向后撤着转
    max_m: 0.30             # 最多后撤多远
    step_m: 0.05            # 每次多撤多少

  # move_joints / go_to_pose:关节组运动(碰撞检查 + 经录好位姿中转 / 关节 RRT 绕行)
  joint_speed_rad_s:        # 最慢关节的峰值速度;几个组一起动时取最小值
    body: 0.10
    head: 0.30
    left_arm: 0.20
    right_arm: 0.20
  max_wait_s: 30            # wait 工具一次最多等多久
  gripper:                  # 夹爪走 GDK(不在 ROS /joint_states 里),见 harness/backends/gripper_gdk.py
    interface: servo        # servo:发 /gdk/joint_control(手臂插件也在用伺服,GDK 文档要求末端同走伺服);move_ee_pos:GDK 接口
    servo_hold_s: 1.0       # servo 方式连续发多久
    servo_rate_hz: 50
    settle_s: 1.0           # 发完等多久再读状态
    position_tol: 0.05      # 读得到位置时,离目标多近算到位(弧度;dahuan 是米)
    read_position: false    # 这台机器人不发夹爪状态,读 get_end_state 只会阻塞 2s + 打一行 E 日志;以后固件支持再开
  max_joint_delta_deg:      # move_joints 一次每个关节最多转多少度(go_to_pose 不受此限,位姿是人录的)
    body: 45
    head: 90
    left_arm: 120
    right_arm: 120

vision:
  timeout_s: 4.0            # 等一帧头部 RGBD(彩色 + 深度 + TF)最多多久
  photo:                    # take_photo:存一张相机照片(机器人不动)
    dir: photos             # 相对项目根目录;已 gitignore(照片里有人)
    default_camera: head_wide
    timeout_s: 3.0
    cameras:                # 名字 → sensor_msgs/CompressedImage 话题(JPEG 原样存盘,不重新编码)
      head_wide: /gdk/camera/head_stereo_left   # 头部双目左目,1920x1536,广角,适合拍人群
      head: /gdk/camera/head_color              # 头部 RGBD 的彩色,640x400,和深度对齐
      # hand_right: /gdk/camera/hand_right_color  # 腕部相机线丢了(2026-11-14),先不开放;接回后去掉注释
  # 腕部相机(harness/perception/wrist_camera.py,RosBackend.wrist_frame),设计见 docs/wrist_camera.md。
  # 2026-11-14 相机线丢了,先停用;接回后先跑 scripts/check_wrist_camera.py,再去掉下面的注释
  # wrist:
  #   timeout_s: 2.0
  #   right:
  #     color: /gdk/camera/hand_right_color   # sensor_msgs/CompressedImage
  #     depth: null           # 确认有深度帧后填(G01 的 D405 是 /camera/hand_right_depth,16UC1)
  sam3:                     # find_objects:按英文名词找物体(~/sam3_service/server.py 要先开着)
    url: http://127.0.0.1:8765
    timeout_s: 10.0         # 一次分割最多等多久(正常 0.4s,刚启动的第一张约 1s)
    threshold: 0.5          # SAM 3 置信度阈值
    min_valid_depth_pixels: 15   # 掩码里至少这么多像素有深度,才算出 3D 坐标
