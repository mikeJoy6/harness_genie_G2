# 可识别的颜色。每项是一组 HSV 范围 [[H,S,V 下限], [H,S,V 上限]],OpenCV 的 H 范围是 0~179。
# 新颜色用 scripts/hsv_pick.py 点选添加,这里的名字会自动提供给模型。
red:
- [[0, 120, 70], [10, 255, 255]]
- [[170, 120, 70], [179, 255, 255]]
orange:
- [[11, 120, 80], [22, 255, 255]]
yellow:
- [[23, 100, 80], [34, 255, 255]]
green:
- [[35, 60, 40], [85, 255, 255]]
blue:
- [[100, 100, 50], [130, 255, 255]]
purple:
- [[131, 60, 50], [160, 255, 255]]
